<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1380" role="img" aria-labelledby="title desc">
  <title id="title">Khung nghiên cứu EvidenceTrace</title>
  <desc id="desc">Sơ đồ dọc mô tả dữ liệu theo đúng thời điểm khả dụng, ba cấu hình kỹ thuật, từ khóa và ngữ nghĩa; việc kiểm tra độ phủ tin tức được tách riêng khỏi mô hình dự báo; bằng chứng ngữ nghĩa, EvidenceTrace và ba vùng thời gian.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#162A3A"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2E6F95"/></marker>
    <marker id="arrow-copper" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#A44A3F"/></marker>
    <style>
      .title { font: 700 27px 'Times New Roman', Times, serif; fill:#162A3A; letter-spacing:.5px; }
      .subtitle { font: 16px 'Times New Roman', Times, serif; fill:#4D606B; }
      .lane { font: 700 16px Arial, Helvetica, sans-serif; fill:#162A3A; letter-spacing:1px; }
      .box-title { font: 700 19px 'Times New Roman', Times, serif; fill:#162A3A; }
      .arm-title { font: 700 17px 'Times New Roman', Times, serif; fill:#162A3A; }
      .box-copy { font: 15px Arial, Helvetica, sans-serif; fill:#40515B; }
      .code { font: 700 21px Arial, Helvetica, sans-serif; fill:#162A3A; }
      .micro { font: 13px Arial, Helvetica, sans-serif; fill:#4D606B; }
      .zone { font: 700 15px Arial, Helvetica, sans-serif; fill:#162A3A; letter-spacing:.3px; }
      .box { fill:#FFFFFF; stroke:#162A3A; stroke-width:2; }
      .tech { fill:#EFF7FA; stroke:#2E6F95; stroke-width:2.5; }
      .semantic { fill:#FFF3EF; stroke:#A44A3F; stroke-width:2.5; }
      .audit { fill:#F4F7F8; stroke:#607582; stroke-width:2; }
      .audit-separate { fill:#F4F7F8; stroke:#607582; stroke-width:2.5; stroke-dasharray:9 6; }
    </style>
  </defs>

  <rect width="1000" height="1380" fill="#FFFFFF"/>
  <rect x="48" y="36" width="904" height="88" fill="#F4F7F8" stroke="#D7E0E5" stroke-width="2"/>
  <text x="500" y="75" text-anchor="middle" class="title">KHUNG NGHIÊN CỨU VÀ RANH GIỚI THỜI GIAN</text>
  <text x="500" y="103" text-anchor="middle" class="subtitle">ba nhánh mô hình · audit độ phủ tách biệt · EvidenceTrace có truy vết</text>

  <text x="60" y="158" class="lane">1. ĐÁNH GIÁ DỰ BÁO NGOÀI MẪU</text>
  <line x1="60" y1="171" x2="940" y2="171" stroke="#D7E0E5" stroke-width="2"/>

  <rect x="100" y="194" width="330" height="96" class="box"/>
  <text x="265" y="228" text-anchor="middle" class="box-title">Dữ liệu khả dụng tại t0</text>
  <text x="265" y="254" text-anchor="middle" class="box-copy">OHLCV · tin tức căn chỉnh PIT</text>
  <text x="265" y="276" text-anchor="middle" class="micro">cùng nhãn · cùng dòng · cùng fold</text>

  <rect x="570" y="194" width="330" height="96" class="tech"/>
  <text x="735" y="228" text-anchor="middle" class="box-title">Nền kỹ thuật chung</text>
  <text x="735" y="254" text-anchor="middle" class="box-copy">Technical point-in-time</text>
  <text x="735" y="276" text-anchor="middle" class="micro">không gồm Coverage</text>

  <line x1="430" y1="242" x2="560" y2="242" stroke="#2E6F95" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="495" y="226" text-anchor="middle" class="micro">căn chỉnh PIT</text>

  <path d="M735 290 L735 314 L500 314 L500 334" fill="none" stroke="#162A3A" stroke-width="3"/>
  <line x1="177" y1="334" x2="823" y2="334" stroke="#162A3A" stroke-width="3"/>
  <line x1="177" y1="334" x2="177" y2="356" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <line x1="500" y1="334" x2="500" y2="356" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <line x1="823" y1="334" x2="823" y2="356" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>

  <rect x="65" y="370" width="225" height="96" class="tech"/>
  <text x="177" y="406" text-anchor="middle" class="arm-title">Cấu hình kỹ thuật</text>
  <text x="177" y="438" text-anchor="middle" class="micro">chỉ đặc trưng kỹ thuật</text>

  <rect x="387" y="370" width="226" height="96" class="box"/>
  <text x="500" y="406" text-anchor="middle" class="arm-title">Cấu hình từ khóa</text>
  <text x="500" y="438" text-anchor="middle" class="micro">kỹ thuật + biểu diễn từ khóa</text>

  <rect x="710" y="370" width="225" height="96" class="semantic"/>
  <text x="823" y="406" text-anchor="middle" class="arm-title">Cấu hình ngữ nghĩa</text>
  <text x="823" y="438" text-anchor="middle" class="micro">kỹ thuật + biểu diễn ngữ nghĩa</text>

  <rect x="125" y="500" width="750" height="88" rx="8" class="audit-separate"/>
  <text x="500" y="530" text-anchor="middle" class="zone">COVERAGE AUDIT · STRATIFICATION · SENSITIVITY</text>
  <text x="500" y="556" text-anchor="middle" class="box-copy">thành phần kiểm tra tách biệt — không phải nhánh mô hình thứ tư</text>
  <text x="500" y="577" text-anchor="middle" class="micro">không là biến dự báo · không dùng bộ lọc Coverage &gt; 0 cho mẫu chính</text>

  <path d="M177 466 L177 486 L95 486 L95 610 L260 610 L260 624" fill="none" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <path d="M500 466 L500 490 L910 490 L910 590 L500 590 L500 624" fill="none" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <path d="M823 466 L823 480 L930 480 L930 610 L760 610 L760 624" fill="none" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <rect x="105" y="638" width="790" height="103" class="audit"/>
  <text x="500" y="671" text-anchor="middle" class="box-title">Đánh giá ngoài mẫu theo cặp trên cùng mẫu</text>
  <text x="500" y="700" text-anchor="middle" class="box-copy">ngữ nghĩa so với kỹ thuật · từ khóa so với kỹ thuật · so sánh trực tiếp hai biểu diễn</text>
  <text x="500" y="724" text-anchor="middle" class="micro">expanding folds · purge · train-only transforms · protocol đã khóa</text>

  <text x="60" y="790" class="lane">2. BẰNG CHỨNG VÀ NGUYÊN MẪU EVIDENCETRACE</text>
  <line x1="60" y1="803" x2="940" y2="803" stroke="#D7E0E5" stroke-width="2"/>

  <rect x="84" y="828" width="190" height="106" class="box"/>
  <text x="179" y="862" text-anchor="middle" class="box-title">Tin tức đã</text>
  <text x="179" y="886" text-anchor="middle" class="box-title">liên kết mã</text>
  <text x="179" y="913" text-anchor="middle" class="micro">nguồn · timestamp · ID</text>

  <line x1="274" y1="881" x2="330" y2="881" stroke="#A44A3F" stroke-width="3" marker-end="url(#arrow-copper)"/>
  <rect x="342" y="828" width="240" height="106" class="semantic"/>
  <text x="462" y="862" text-anchor="middle" class="box-title">Sự kiện ngữ nghĩa</text>
  <text x="462" y="888" text-anchor="middle" class="micro">relevance · materiality · event</text>
  <text x="462" y="910" text-anchor="middle" class="micro">direction · evidence span</text>

  <line x1="582" y1="881" x2="638" y2="881" stroke="#A44A3F" stroke-width="3" marker-end="url(#arrow-copper)"/>
  <rect x="650" y="828" width="266" height="106" class="audit"/>
  <text x="783" y="862" text-anchor="middle" class="box-title">EvidenceTrace</text>
  <text x="783" y="888" text-anchor="middle" class="micro">gói bằng chứng · thẻ quyết định</text>
  <text x="783" y="910" text-anchor="middle" class="micro">theo dõi · provenance · hậu kiểm</text>

  <text x="60" y="988" class="lane">3. BA VÙNG THỜI GIAN VÀ KIỂM SOÁT RÒ RỈ</text>
  <line x1="60" y1="1001" x2="940" y2="1001" stroke="#D7E0E5" stroke-width="2"/>

  <rect x="65" y="1028" width="270" height="167" fill="#EFF7FA" stroke="#2E6F95" stroke-width="2"/>
  <text x="87" y="1060" class="zone">QUYẾT ĐỊNH BAN ĐẦU · t0</text>
  <text x="87" y="1090" class="micro">signal · evidence · thẻ ban đầu</text>
  <text x="87" y="1115" class="micro">chỉ dữ liệu đã khả dụng</text>
  <text x="87" y="1140" class="micro">không có outcome tương lai</text>
  <circle cx="103" cy="1168" r="12" fill="#FFFFFF" stroke="#A44A3F" stroke-width="2"/>
  <line x1="95" y1="1160" x2="111" y2="1176" stroke="#A44A3F" stroke-width="3"/>
  <text x="127" y="1173" class="micro">outcome bị cấm</text>

  <rect x="365" y="1028" width="270" height="167" fill="#F4F7F8" stroke="#2B7A78" stroke-width="2"/>
  <text x="387" y="1060" class="zone">THEO DÕI · t0 &lt; t &lt; t_exit</text>
  <text x="387" y="1090" class="micro">sự kiện sau quyết định</text>
  <text x="387" y="1115" class="micro">timestamp · nguồn · trigger</text>
  <text x="387" y="1140" class="micro">không đổi initial state</text>

  <rect x="665" y="1028" width="270" height="167" fill="#FFF3EF" stroke="#A44A3F" stroke-width="2"/>
  <text x="687" y="1060" class="zone">HẬU KIỂM · t ≥ t_exit</text>
  <text x="687" y="1090" class="micro">outcome · benchmark · review</text>
  <text x="687" y="1115" class="micro">chỉ mở sau horizon</text>
  <text x="687" y="1140" class="micro">không quay lại thẻ ban đầu</text>

  <line x1="335" y1="1112" x2="355" y2="1112" stroke="#2B7A78" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-ink)"/>
  <line x1="635" y1="1112" x2="655" y2="1112" stroke="#A44A3F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-copper)"/>
  <path d="M800 1208 L800 1260 L200 1260 L200 1208" fill="none" stroke="#A44A3F" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="186" y1="1247" x2="214" y2="1275" stroke="#A44A3F" stroke-width="4"/>
  <line x1="214" y1="1247" x2="186" y2="1275" stroke="#A44A3F" stroke-width="4"/>
  <text x="500" y="1297" text-anchor="middle" class="micro">Không có luồng outcome quay lại quyết định ban đầu.</text>

  <line x1="90" y1="1340" x2="125" y2="1340" stroke="#162A3A" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <text x="140" y="1345" class="micro">luồng dữ liệu/bằng chứng được phép</text>
  <line x1="560" y1="1340" x2="595" y2="1340" stroke="#162A3A" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-ink)"/>
  <text x="610" y="1345" class="micro">tiến trình thời gian hoặc audit-only</text>
</svg>
