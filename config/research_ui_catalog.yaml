catalog_version: research-ui-catalog-v1
dataset_id: evidencetrace-decision-support-2026-07
research_only: true
runtime_policy:
  ui_reads_validated_bundle_only: true
  no_live_market_data: true
  no_investment_advice: true
  external_context:
    fireant_markets_browser_display:
      enabled: true
      mode: fixed_browser_embed_display_only
      widget_url: https://www.fireant.vn/Widgets/Markets
      native_vnindex_fallback_url: https://fireant.vn/ma-chung-khoan/VNINDEX
      server_fetch: false
      proxy: false
      provider_content_ingestion: false
      evidence_model_monitoring_review_evaluation_use: false
    fireant_selected_ticker_adapter:
      enabled: true
      mode: selected_quote_browser_embed_display_only
      ticker_source: validated_bundle_selected_decision
      widget_origin: https://www.fireant.vn
      widget_path: /Widgets/Quote
      widget_query_key: symbols
      native_origin: https://fireant.vn
      native_path_template: /ma-chung-khoan/{TICKER}
      server_fetch: false
      proxy: false
      provider_content_ingestion: false
      evidence_model_monitoring_review_evaluation_use: false
    historical_technical_panel:
      enabled: true
      source: validated_initial_bundle
      cutoff_field: decision_date
      runtime_recomputation: false
      fireant_to_prompt: false
    fresh_news_snapshot_allowed: true
    canonical_artifact_mutation_forbidden: true
  initial_forbidden_markers:
    - outcome
    - realized
    - review_only
    - benchmark_return
    - excess_return
    - future_return
    - future_label
  monitoring_join_order:
    - deterministic_news_id
    - unambiguous_canonical_content_hash
  title_only_join_forbidden: true

